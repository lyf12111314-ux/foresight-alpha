# Foresight Alpha 系统全局配置
system:
  name: "新兴产业与非对称财富机会智能预测系统"
  version: "1.0.0"
  env: "production"
  base_dir: "."
  random_seed: 42

storage:
  database_path: "data/storage.duckdb"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  provenance_dir: "data/provenance"
  export_dir: "data/exports"

api_limits:
  openalex:
    base_url: "https://api.openalex.org"
    rate_limit_per_sec: 5
    timeout_sec: 10
  arxiv:
    base_url: "https://export.arxiv.org/api/query"
    rate_limit_per_sec: 1
    timeout_sec: 15
  github:
    base_url: "https://api.github.com"
    rate_limit_per_sec: 2
    timeout_sec: 10
  world_bank:
    base_url: "https://api.worldbank.org/v2"
    timeout_sec: 10

models:
  macro:
    hmm_n_components: 4
    hmm_covariance_type: "full"
  tech_discovery:
    similarity_threshold: 0.75
    min_cluster_size: 3
    novelty_percentile: 85
  diffusion:
    horizons_years: [1, 3, 5]
    confidence_interval: 0.80
    lgbm_params:
      n_estimators: 100
      learning_rate: 0.05
      num_leaves: 31
      random_state: 42
  survival:
    cox_penalizer: 0.1
    time_horizon_years: 5
  asymmetric:
    mc_simulations: 5000
    quantiles: [0.10, 0.50, 0.90]

backtest:
  default_start_year: 2020
  default_end_year: 2024
  step_months: 6
  top_k_candidates: 5

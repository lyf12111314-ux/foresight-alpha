# 五级研究对象与核心产业清单字典定义
levels:
  - id: 1
    name: "技术主题 (Tech Topic)"
    description: "具有突破性潜力的底层科学与工程技术，跨越论文、代码与专利"
  - id: 2
    name: "新兴产业及细分赛道 (Emerging Industry / Sector)"
    description: "具备商业化产品形态和早期市场空间的产业分支"
  - id: 3
    name: "产业链环节 (Value Chain Segment)"
    description: "上游材料/核心部件、中游集成/设备、下游应用运营"
  - id: 4
    name: "具体企业或项目 (Company / Entity / Project)"
    description: "公开发行主体或代表性实体，具备真实经营和财务数据"
  - id: 5
    name: "可合法持有资产/经营权益 (Investable Asset / Operating Right)"
    description: "可在公开二级市场、特定合规平台持有的合法收益凭证"

core_domains:
  - domain_id: "AI_INFRA"
    name: "人工智能与智能体基础设施"
    topics: ["Agentic AI", "神经拟态计算", "Transformer架构优化", "端侧AI大模型", "智能体交易协议"]
    industries: ["AI算力芯片", "高速光通信", "向量数据基础设施", "AI开发平台", "具身智能云脑"]
    value_chain_nodes:
      - node_id: "AI_CHIP_DESIGN"
        name: "算力芯片设计 (GPU/NPU/ASIC)"
        tier: "UPSTREAM"
        gross_margin_range: [45.0, 75.0]
        capex_intensity: "HIGH"
      - node_id: "OPTICAL_TRANSCEIVER"
        name: "800G/1.6T 高速光模块"
        tier: "MIDSTREAM"
        gross_margin_range: [30.0, 45.0]
        capex_intensity: "MEDIUM"
      - node_id: "AI_CLOUD_COMPUTE"
        name: "智能算力云服务与调度"
        tier: "DOWNSTREAM"
        gross_margin_range: [20.0, 35.0]
        capex_intensity: "VERY_HIGH"

  - domain_id: "ROBOTICS_EMBODIED"
    name: "机器人与具身智能"
